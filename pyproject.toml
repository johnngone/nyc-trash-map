[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-trash-map"
version = "1.0.1"
description = "Interactive map of NYC trash collection schedules"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.10.19",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
refresh = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "mapbox-vector-tile>=2.2,<3",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["backend"]

