name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
      - run: |
          python -m pip install --upgrade pip==26.2.2 setuptools==84.1.0 wheel==0.46.3
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps --build-constraint build-constraints.txt -e .
          python -m pip install pytest==8.4.2
      - name: Prepare writable runtime data directory
        run: mkdir -p data
      - run: python -m pytest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -f Dockerfile -t nyc-trash-map:test .
      - name: Verify standalone refresh dependencies
        run: docker run --rm --entrypoint python nyc-trash-map:test -c "import geopandas, mapbox_vector_tile, shapely; from scripts.build_tiles import build_tiles"
      - name: Smoke-test standalone image
        run: bash scripts/smoke_container.sh nyc-trash-map:test nyc-trash-map-test
