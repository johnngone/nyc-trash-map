name: Build NYC Trash Map Container

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: nyc-trash-map-container-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nyc-trash-map

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
      - name: Install test and refresh dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2 setuptools==84.1.0 wheel==0.46.3
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps --build-constraint build-constraints.txt -e .
          python -m pip install pytest==8.4.2
      - name: Prepare writable runtime data directory
        run: mkdir -p data
      - name: Run full Python test suite
        run: python -m pytest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend test suite
        run: npm test
        working-directory: frontend
      - name: Build app image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: nyc-trash-map:ci
      - name: Audit release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: nyc-trash-map:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke-test standalone image
        run: bash scripts/smoke_container.sh nyc-trash-map:ci nyc-trash-map-publish-test
      - name: Set up QEMU for ARM64 builds
        if: github.event_name == 'release'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: github.event_name == 'release'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release image tags
        id: release-tags
        if: github.event_name == 'release'
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          {
            echo "version=${RELEASE_TAG#v}"
            echo 'tags<<EOF'
            echo "${IMAGE}:${RELEASE_TAG}"
            if [[ "${IS_PRERELEASE}" == "false" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"
      - name: Publish AMD64 and ARM64 release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release-tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.release-tags.outputs.version }}
      - name: Verify published image platforms
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}")"
          printf '%s\n' "${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<<"${inspect_output}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<<"${inspect_output}"
